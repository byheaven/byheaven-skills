# .github/workflows/ci.yml
# Plugin monorepo CI — markdown linting, the manager agent copy check, and script tests (no build)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Markdown
        run: npm run lint:md

      - name: Check manager agent principles copy
        run: npm run check:manager

      - name: Check harness portability
        run: npm run check:portability

      - name: Test manager scripts
        run: python3 -m unittest discover -s plugins/manager/skills/manager/scripts

      - name: Test manager hooks
        run: python3 -m unittest discover -s plugins/manager/hooks
