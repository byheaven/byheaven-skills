# .github/workflows/release.yml
# Responsibility: Publish a GitHub Release for each plugin version that reaches main.
# A push to main releases every plugin whose marketplace version changed in that push
# and has no tag yet: it tags the pushed commit and creates the Release in this job
# (tags pushed with GITHUB_TOKEN do not trigger other workflows).
# Pushing a `<plugin>-<x.y.z>` tag by hand still publishes that tag's Release.

name: Release

on:
  push:
    branches: [main]
    tags:
      - '*-*.*.*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine tags to release
        id: plan
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$REF_TYPE" == "tag" ]]; then
            echo "tags=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No previous commit to compare; nothing to release."
            echo "tags=" >> "$GITHUB_OUTPUT"
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAGS=$(python3 - "$BEFORE" <<'PY'
          import json
          import subprocess
          import sys

          before = sys.argv[1]
          path = ".claude-plugin/marketplace.json"

          def versions(text):
              return {p["name"]: p.get("version") for p in json.loads(text)["plugins"]}

          old_text = subprocess.run(
              ["git", "show", f"{before}:{path}"], capture_output=True, text=True
          )
          old = versions(old_text.stdout) if old_text.returncode == 0 else {}
          new = versions(open(path, encoding="utf-8").read())

          for name, version in new.items():
              if not version or old.get(name) == version:
                  continue
              tag = f"{name}-{version}"
              exists = subprocess.run(
                  ["git", "rev-parse", "-q", "--verify", f"refs/tags/{tag}"],
                  capture_output=True,
              ).returncode == 0
              if not exists:
                  print(tag)
          PY
          )

          TAGS=$(echo "$TAGS" | xargs)
          echo "Tags to release: ${TAGS:-none}"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "create=true" >> "$GITHUB_OUTPUT"

      - name: Validate, tag, and publish
        if: steps.plan.outputs.tags != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ steps.plan.outputs.tags }}
          CREATE_TAG: ${{ steps.plan.outputs.create }}
        run: |
          set -euo pipefail

          MARKETPLACE_FILE=".claude-plugin/marketplace.json"
          chmod +x scripts/extract-release-notes.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for TAG in $TAGS; do
            VERSION=$(echo "$TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$')
            if [[ -z "$VERSION" ]]; then
              echo "Tag must end with a semantic version: $TAG" >&2
              exit 1
            fi
            COMPONENT="${TAG%-"$VERSION"}"
            PLUGIN_DIR="plugins/$COMPONENT"
            CHANGELOG_FILE="$PLUGIN_DIR/CHANGELOG.md"

            if [[ ! -d "$PLUGIN_DIR" ]]; then
              echo "Plugin directory not found for tag $TAG: $PLUGIN_DIR" >&2
              exit 1
            fi
            if [[ ! -f "$CHANGELOG_FILE" ]]; then
              echo "Plugin changelog not found: $CHANGELOG_FILE" >&2
              exit 1
            fi

            ACTUAL_VERSION=$(python3 - "$MARKETPLACE_FILE" "$COMPONENT" <<'PY'
          import json
          import sys

          marketplace_file, component = sys.argv[1:]
          plugins = json.load(open(marketplace_file, encoding="utf-8"))["plugins"]
          for plugin in plugins:
              if plugin["name"] == component:
                  version = plugin.get("version")
                  if not version:
                      raise SystemExit(f"Plugin entry {component} has no version in {marketplace_file}")
                  print(version)
                  raise SystemExit(0)
          raise SystemExit(f"Plugin entry {component} not found in {marketplace_file}")
          PY
            )
            if [[ "$ACTUAL_VERSION" != "$VERSION" ]]; then
              echo "Tag version $VERSION does not match marketplace version $ACTUAL_VERSION" >&2
              exit 1
            fi

            # Fails when the changelog has no section for this version.
            CHANGELOG_FILE="$CHANGELOG_FILE" ./scripts/extract-release-notes.sh "$TAG"

            if [[ "$CREATE_TAG" == "true" ]]; then
              git tag -a -m "release $COMPONENT $VERSION" "$TAG" "$GITHUB_SHA"
              git push origin "refs/tags/$TAG"
            fi

            if [[ -s RELEASE_TITLE.txt ]]; then
              TITLE="$TAG - $(cat RELEASE_TITLE.txt)"
            else
              TITLE="$TAG"
            fi

            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md
            else
              gh release create "$TAG" --verify-tag --title "$TITLE" --notes-file RELEASE_NOTES.md
            fi
          done
